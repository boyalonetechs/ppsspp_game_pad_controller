<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PSP Pad</title>
<style>
  :root {
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);

    --ink: #e9eef7;
    --muted: rgba(233, 238, 247, .40);
    --line: rgba(255, 255, 255, .13);
    --glass: rgba(255, 255, 255, .045);
    --glass-hi: rgba(255, 255, 255, .09);

    --tri: #7ee0b8;
    --cir: #ff9098;
    --cro: #8ab8ff;
    --squ: #f3a8e0;

    --dpad: clamp(96px, 31vmin, 190px);
    --stick: clamp(100px, 32vmin, 200px);
    --face: clamp(168px, 40vmin, 250px);
    --shoulder-w: clamp(88px, 18vmin, 150px);
    --shoulder-h: clamp(42px, 9vmin, 62px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #07090c;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 620px at 50% -12%, rgba(58, 86, 120, .38), transparent 62%),
      radial-gradient(900px 500px at 50% 118%, rgba(38, 61, 86, .20), transparent 65%),
      radial-gradient(rgba(255, 255, 255, .032) 1px, transparent 0);
    background-size: auto, auto, 22px 22px;
    z-index: 0;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    padding: 0;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
  }

  #app {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ---------------------------------------------------------------- top */

  #topbar {
    position: absolute;
    top: calc(var(--sat) + 10px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 6;
  }

  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(9, 12, 16, .62);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: clamp(9px, 1.7vmin, 12px);
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  #status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6b7280;
    transition: background .25s, box-shadow .25s;
  }
  #status.ok .dot { background: #46d585; box-shadow: 0 0 10px #46d585; animation: breathe 2.4s ease-in-out infinite; }
  #status.bad .dot { background: #ff6b6b; box-shadow: 0 0 8px rgba(255, 107, 107, .7); }
  #status.ok { color: rgba(233, 238, 247, .72); }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }

  #fsBtn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(9, 12, 16, .62);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: grid;
    place-items: center;
    color: rgba(233, 238, 247, .65);
    transition: transform .12s, color .12s, background .12s;
  }
  #fsBtn:active { transform: scale(.9); color: #fff; background: rgba(255, 255, 255, .12); }
  #fsBtn svg { width: 16px; height: 16px; }

  /* ----------------------------------------------------------- shoulders */

  .shoulder {
    position: absolute;
    top: calc(var(--sat) + 10px);
    width: var(--shoulder-w);
    height: var(--shoulder-h);
    border-radius: clamp(12px, 2.4vmin, 20px);
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .025));
    box-shadow: 0 12px 30px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .12);
    display: grid;
    place-items: center;
    font-size: clamp(13px, 2.8vmin, 20px);
    font-weight: 700;
    letter-spacing: .18em;
    text-indent: .18em;
    color: rgba(233, 238, 247, .62);
    z-index: 5;
  }
  .shoulder.l { left: calc(var(--sal) + 14px); }
  .shoulder.r { right: calc(var(--sar) + 14px); }
  .shoulder.pressed { background: linear-gradient(180deg, rgba(138, 184, 255, .34), rgba(138, 184, 255, .10)); color: #fff; }

  /* ---------------------------------------------------------------- dpad */

  #dpad {
    position: absolute;
    left: calc(var(--sal) + 2vmin);
    top: 50%;
    transform: translateY(-50%);
    width: var(--dpad);
    height: var(--dpad);
    border-radius: 26%;
    border: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 40%, rgba(255, 255, 255, .055), rgba(255, 255, 255, .015) 70%),
      rgba(10, 13, 17, .35);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .07);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    z-index: 4;
  }

  #dpad .arrow {
    display: grid;
    place-items: center;
    font-size: clamp(13px, 3.2vmin, 24px);
    line-height: 1;
    color: rgba(233, 238, 247, .30);
    border-radius: 28%;
    transition: color .08s, background .08s, text-shadow .08s;
    pointer-events: none;
  }
  #dpad .up    { grid-area: 1 / 2; }
  #dpad .right { grid-area: 2 / 3; }
  #dpad .down  { grid-area: 3 / 2; }
  #dpad .left  { grid-area: 2 / 1; }
  #dpad .hub {
    grid-area: 2 / 2;
    align-self: center;
    justify-self: center;
    width: 58%;
    height: 58%;
    border-radius: 34%;
    border: 1px solid rgba(255, 255, 255, .10);
    background: rgba(255, 255, 255, .045);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10);
    pointer-events: none;
  }

  #dpad.dir-up .arrow.up,
  #dpad.dir-down .arrow.down,
  #dpad.dir-left .arrow.left,
  #dpad.dir-right .arrow.right {
    color: #fff;
    background: rgba(138, 184, 255, .20);
    text-shadow: 0 0 14px rgba(138, 184, 255, .95);
  }

  /* --------------------------------------------------------------- stick */

  #stickBase {
    position: absolute;
    left: calc(var(--sal) + 2vmin + var(--dpad) + 2vmin);
    top: 50%;
    transform: translateY(-50%);
    width: var(--stick);
    height: var(--stick);
    border-radius: 50%;
    border: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .06), rgba(255, 255, 255, .012) 62%),
      rgba(9, 12, 16, .42);
    box-shadow: 0 20px 44px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .08);
    display: grid;
    place-items: center;
    z-index: 4;
  }

  #stickBase::before {
    content: "";
    position: absolute;
    inset: 11%;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, .09);
    pointer-events: none;
  }

  #stickKnob {
    width: 48%;
    height: 48%;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #77849a 0%, #3a4351 42%, #232a34 72%, #171c23 100%);
    border: 1px solid rgba(255, 255, 255, .17);
    box-shadow:
      0 10px 22px rgba(0, 0, 0, .55),
      inset 0 2px 4px rgba(255, 255, 255, .16),
      inset 0 -6px 12px rgba(0, 0, 0, .42);
    pointer-events: none;
    will-change: transform;
  }
  #stickKnob.snap { transition: transform .16s cubic-bezier(.2, .8, .3, 1.2); }

  .stick-label {
    position: absolute;
    left: 50%;
    bottom: -1.7em;
    transform: translateX(-50%);
    font-size: clamp(8px, 1.5vmin, 11px);
    letter-spacing: .28em;
    text-indent: .28em;
    color: rgba(233, 238, 247, .22);
    pointer-events: none;
    white-space: nowrap;
  }

  /* ---------------------------------------------------------------- face */

  #face {
    position: absolute;
    right: calc(var(--sar) + 2vmin);
    top: 50%;
    transform: translateY(-50%);
    width: var(--face);
    height: var(--face);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    z-index: 4;
  }

  .face {
    width: 92%;
    height: 92%;
    place-self: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .16), rgba(255, 255, 255, .028) 58%, rgba(0, 0, 0, .22));
    box-shadow: 0 12px 28px rgba(0, 0, 0, .40), inset 0 1px 0 rgba(255, 255, 255, .14);
    display: grid;
    place-items: center;
    font-size: clamp(18px, 5vmin, 38px);
    font-weight: 600;
    line-height: 1;
    transition: transform .09s, filter .09s, background .09s;
  }
  .face.triangle { grid-area: 1 / 2; color: var(--tri); }
  .face.circle   { grid-area: 2 / 3; color: var(--cir); }
  .face.cross    { grid-area: 3 / 2; color: var(--cro); }
  .face.square   { grid-area: 2 / 1; color: var(--squ); }

  .face.pressed { transform: scale(.92); filter: brightness(1.55); }

  /* ------------------------------------------------------- center / small */

  #center {
    position: absolute;
    left: 50%;
    bottom: calc(var(--sab) + 2vmin);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.8vmin, 14px);
    z-index: 4;
  }

  .hotkeys { display: flex; gap: clamp(6px, 1.4vmin, 12px); }

  .hot {
    height: clamp(26px, 5.2vmin, 38px);
    padding: 0 clamp(9px, 1.9vmin, 16px);
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--glass);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    font-size: clamp(8px, 1.55vmin, 11px);
    font-weight: 700;
    letter-spacing: .10em;
    color: rgba(233, 238, 247, .46);
    transition: transform .09s, background .09s, color .09s;
  }
  .hot.pressed { transform: scale(.95); background: rgba(138, 184, 255, .22); color: #fff; }

  .startsel { display: flex; align-items: center; gap: clamp(14px, 3.2vmin, 30px); }

  .small {
    height: clamp(30px, 6vmin, 44px);
    padding: 0 clamp(15px, 3vmin, 26px);
    border-radius: 999px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .02));
    box-shadow: 0 10px 24px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .10);
    font-size: clamp(8px, 1.5vmin, 11px);
    font-weight: 700;
    letter-spacing: .16em;
    text-indent: .16em;
    color: rgba(233, 238, 247, .52);
    transition: transform .09s, background .09s, color .09s;
  }
  .small.pressed { transform: scale(.95); background: rgba(255, 255, 255, .14); color: #fff; }

  /* --------------------------------------------------------------- toast */

  #toast {
    position: fixed;
    left: 50%;
    top: calc(var(--sat) + 58px);
    transform: translate(-50%, -6px);
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(9, 12, 16, .82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 12px;
    color: rgba(233, 238, 247, .78);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 20;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ------------------------------------------------------- rotate screen */

  #rotate {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 32px;
    background:
      radial-gradient(700px 480px at 50% 20%, rgba(58, 86, 120, .34), transparent 65%),
      #07090c;
  }
  #rotate .phone {
    width: 64px;
    height: 108px;
    border-radius: 14px;
    border: 2px solid rgba(233, 238, 247, .38);
    position: relative;
    animation: tilt 2.4s ease-in-out infinite;
  }
  #rotate .phone::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 16px;
    height: 3px;
    border-radius: 3px;
    background: rgba(233, 238, 247, .30);
    transform: translateX(-50%);
  }
  #rotate h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: .02em;
  }
  #rotate p {
    margin: 0;
    max-width: 300px;
    font-size: 13px;
    line-height: 1.5;
    color: rgba(233, 238, 247, .48);
  }
  @keyframes tilt {
    0%, 18% { transform: rotate(0deg); }
    45%, 100% { transform: rotate(90deg); }
  }

  @media (orientation: portrait) {
    #rotate { display: flex; }
    #app { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #status.ok .dot, #rotate .phone { animation: none; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="status"><span class="dot"></span><span id="statusText">connecting</span></div>
    <button id="fsBtn" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>

  <button class="shoulder l" type="button" data-btn="l">L</button>
  <button class="shoulder r" type="button" data-btn="r">R</button>

  <div id="dpad" aria-label="D-pad">
    <span class="arrow up">&#9650;</span>
    <span class="arrow right">&#9654;</span>
    <span class="arrow down">&#9660;</span>
    <span class="arrow left">&#9664;</span>
    <div class="hub"></div>
  </div>

  <div id="stickBase" aria-label="Analog stick">
    <div id="stickKnob"></div>
    <div class="stick-label">ANALOG</div>
  </div>

  <div id="face">
    <button class="face triangle" type="button" data-btn="triangle">&#9651;</button>
    <button class="face circle" type="button" data-btn="circle">&#9675;</button>
    <button class="face cross" type="button" data-btn="cross">&#10005;</button>
    <button class="face square" type="button" data-btn="square">&#9633;</button>
  </div>

  <div id="center">
    <div class="hotkeys">
      <button class="hot" type="button" data-btn="guide">MENU</button>
      <button class="hot" type="button" data-btn="l3">&#9193; FF</button>
      <button class="hot" type="button" data-btn="r3">&#9194; REW</button>
    </div>
    <div class="startsel">
      <button class="small" type="button" data-btn="select">SELECT</button>
      <button class="small" type="button" data-btn="start">START</button>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="phone"></div>
  <h1>Rotate your phone</h1>
  <p>PSP games need a landscape screen. Turn the phone sideways to use the pad.</p>
</div>

<div id="toast"></div>

<script>
(() => {
  "use strict";

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const toastEl = document.getElementById("toast");

  let ws = null;
  let reconnectDelay = 600;
  let pingTimer = null;
  let latency = null;

  const heldEls = new Set();
  const heldButtons = new Map(); // name -> count

  // ---------------------------------------------------------------- status

  function setStatus(state, text) {
    statusEl.classList.remove("ok", "bad");
    if (state) statusEl.classList.add(state);
    statusText.textContent = text;
  }

  function updateStatus() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      setStatus("ok", latency == null ? "connected" : `connected \u00b7 ${latency} ms`);
    }
  }

  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  // ------------------------------------------------------------ websocket

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    setStatus("", "connecting");
    ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => {
      reconnectDelay = 600;
      latency = null;
      updateStatus();
      startPing();
    };

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg && msg.t === "pong" && typeof msg.ts === "number") {
        latency = Math.max(0, Math.round(performance.now() - msg.ts));
        updateStatus();
      }
    };

    ws.onclose = () => {
      stopPing();
      setStatus("bad", "offline \u00b7 retrying");
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.6, 4000);
    };

    ws.onerror = () => { try { ws.close(); } catch {} };
  }

  function startPing() {
    stopPing();
    const ping = () => send({ t: "ping", ts: performance.now() });
    ping();
    pingTimer = setInterval(ping, 3000);
  }

  function stopPing() {
    if (pingTimer) clearInterval(pingTimer);
    pingTimer = null;
  }

  // --------------------------------------------------------------- buttons

  function buzz() {
    try { navigator.vibrate && navigator.vibrate(8); } catch {}
  }

  function press(name) {
    const n = (heldButtons.get(name) || 0) + 1;
    heldButtons.set(name, n);
    if (n === 1) send({ t: "b", k: name, v: 1 });
  }

  function unpress(name) {
    const n = heldButtons.get(name) || 0;
    if (n <= 0) return;
    if (n === 1) {
      heldButtons.delete(name);
      send({ t: "b", k: name, v: 0 });
    } else {
      heldButtons.set(name, n - 1);
    }
  }

  function bindButton(el) {
    const name = el.dataset.btn;
    if (!name) return;
    el._pointers = new Set();

    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (el._pointers.size === 0) {
        el.classList.add("pressed");
        heldEls.add(el);
        press(name);
        buzz();
      }
      el._pointers.add(e.pointerId);
      try { el.setPointerCapture(e.pointerId); } catch {}
    });

    const release = (e) => {
      if (!el._pointers.has(e.pointerId)) return;
      el._pointers.delete(e.pointerId);
      if (el._pointers.size === 0) {
        el.classList.remove("pressed");
        heldEls.delete(el);
        unpress(name);
      }
    };

    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("lostpointercapture", release);
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  document.querySelectorAll("[data-btn]").forEach(bindButton);

  // ------------------------------------------------------------------ dpad

  const dpad = document.getElementById("dpad");
  let dpadPointer = null;
  const hat = { x: 0, y: 0 };

  function setHat(x, y) {
    if (x === hat.x && y === hat.y) return;
    hat.x = x;
    hat.y = y;
    dpad.classList.remove("dir-up", "dir-down", "dir-left", "dir-right");
    if (y < 0) dpad.classList.add("dir-up");
    if (y > 0) dpad.classList.add("dir-down");
    if (x < 0) dpad.classList.add("dir-left");
    if (x > 0) dpad.classList.add("dir-right");
    send({ t: "hat", x, y });
  }

  function dpadFromEvent(e) {
    const r = dpad.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
    const dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    let x = 0;
    let y = 0;
    if (ax > 0.34) x = Math.sign(dx);
    if (ay > 0.34) y = Math.sign(dy);
    if (x === 0 && y === 0 && (ax > 0.16 || ay > 0.16)) {
      if (ax > ay) x = Math.sign(dx);
      else y = Math.sign(dy);
    }
    return { x, y };
  }

  dpad.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (dpadPointer !== null) return;
    dpadPointer = e.pointerId;
    try { dpad.setPointerCapture(e.pointerId); } catch {}
    const d = dpadFromEvent(e);
    setHat(d.x, d.y);
  });

  dpad.addEventListener("pointermove", (e) => {
    if (e.pointerId !== dpadPointer) return;
    const d = dpadFromEvent(e);
    setHat(d.x, d.y);
  });

  const endDpad = (e) => {
    if (e.pointerId !== dpadPointer) return;
    dpadPointer = null;
    setHat(0, 0);
  };
  dpad.addEventListener("pointerup", endDpad);
  dpad.addEventListener("pointercancel", endDpad);
  dpad.addEventListener("lostpointercapture", endDpad);

  // ----------------------------------------------------------------- stick

  const stickBase = document.getElementById("stickBase");
  const stickKnob = document.getElementById("stickKnob");
  let stickPointer = null;
  let axisPending = null;
  let axisRaf = 0;

  function queueAxis(x, y) {
    axisPending = { x, y };
    if (!axisRaf) axisRaf = requestAnimationFrame(flushAxis);
  }

  function flushAxis() {
    axisRaf = 0;
    if (axisPending) {
      send({ t: "ax", x: +axisPending.x.toFixed(3), y: +axisPending.y.toFixed(3) });
      axisPending = null;
    }
  }

  function moveStick(e) {
    const r = stickBase.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const max = r.width * 0.35;
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if (len > max) {
      dx = (dx / len) * max;
      dy = (dy / len) * max;
    }
    stickKnob.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;

    const nx = dx / max;
    const ny = dy / max;
    const mag = Math.min(1, Math.hypot(nx, ny));
    const dead = 0.13;
    let ox = 0;
    let oy = 0;
    if (mag > dead) {
      const scale = (mag - dead) / (1 - dead) / mag;
      ox = nx * scale;
      oy = ny * scale;
    }
    queueAxis(ox, oy);
  }

  stickBase.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (stickPointer !== null) return;
    stickPointer = e.pointerId;
    try { stickBase.setPointerCapture(e.pointerId); } catch {}
    stickKnob.classList.remove("snap");
    moveStick(e);
  });

  stickBase.addEventListener("pointermove", (e) => {
    if (e.pointerId !== stickPointer) return;
    moveStick(e);
  });

  const endStick = (e) => {
    if (e.pointerId !== stickPointer) return;
    stickPointer = null;
    stickKnob.classList.add("snap");
    stickKnob.style.transform = "translate(0px, 0px)";
    queueAxis(0, 0);
  };
  stickBase.addEventListener("pointerup", endStick);
  stickBase.addEventListener("pointercancel", endStick);
  stickBase.addEventListener("lostpointercapture", endStick);

  // ----------------------------------------------------------- release all

  function releaseAll() {
    for (const el of heldEls) {
      el.classList.remove("pressed");
      if (el._pointers) el._pointers.clear();
      const name = el.dataset.btn;
      if (name) {
        heldButtons.delete(name);
        send({ t: "b", k: name, v: 0 });
      }
    }
    heldEls.clear();
    heldButtons.clear();

    if (dpadPointer !== null) {
      dpadPointer = null;
      setHat(0, 0);
    }
    if (stickPointer !== null) {
      stickPointer = null;
      stickKnob.classList.add("snap");
      stickKnob.style.transform = "translate(0px, 0px)";
      queueAxis(0, 0);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAll();
    else keepAwake();
  });
  window.addEventListener("blur", releaseAll);
  window.addEventListener("pagehide", releaseAll);

  // ------------------------------------------------------------ fullscreen

  const fsBtn = document.getElementById("fsBtn");

  async function goFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      }
    } catch {
      toast("Fullscreen not available in this browser");
    }
    try {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } catch {}
  }

  fsBtn.addEventListener("click", goFullscreen);

  // -------------------------------------------------------------- wake lock

  let wakeLock = null;
  async function keepAwake() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch {}
  }
  document.addEventListener("pointerdown", keepAwake, { once: true });

  // ------------------------------------------------------------- misc init

  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("dblclick", (e) => e.preventDefault());

  connect();
})();
</script>
</body>
</html>
